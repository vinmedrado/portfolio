.coach-hero{display:flex;gap:16px;align-items:center;background:linear-gradient(120deg,#ffe8d3,#fff1dc);border:1px solid #f2d9c4;border-radius:24px;padding:21px 17px;margin:15px 0}

.coach-metrics b{display:block;font-size:12px;margin-top:7px}
.coach-days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.coach-day{background:#fff;border:1px solid #ede1d9;border-radius:14px;padding:12px 3px 10px;min-width:0;text-align:center;color:#4d454a}
.coach-day.active{background:#fff0dc;border:2px solid #fa7137;color:#e3632b}
.coach-day strong,.coach-day span,.coach-day small{display:block}
.coach-day strong{font-size:11px}.coach-day span{font-size:10px;margin:7px 0}.coach-day small{font-size:9px;color:#948791}

.coach-split{display:flex;justify-content:space-between;gap:9px;align-items:flex-start}

.coach-form .primary{margin-top:18px}.coach-waist input{max-width:190px}.coach-gear{background:#fff9f5;border:1px solid #f2e6df;border-radius:16px;padding:13px;margin-bottom:12px}

/* VIVA visual identity — original vector mascot and illustrated movements */
.viva-mascot{display:block;width:100%;height:100%;max-width:210px;max-height:246px;overflow:visible}
.viva-mascot-wave{transform-origin:145px 115px;animation:viva-wave 3.8s ease-in-out infinite}
.viva-sway{transform-origin:60px 69px;animation:viva-move 2.2s ease-in-out infinite}
@keyframes viva-wave{0%,63%,100%{transform:rotate(0deg)}69%{transform:rotate(-12deg)}77%{transform:rotate(8deg)}85%{transform:rotate(-8deg)}}
@keyframes viva-move{0%,100%{transform:translateY(1px)}50%{transform:translateY(-2px)}}
.viva-main-hero{display:flex;align-items:center;gap:3px;padding:15px 15px 0 22px;min-height:222px;isolation:isolate}
.viva-main-hero:after{z-index:-1}.viva-main-copy{min-width:0;flex:1;align-self:center;padding-bottom:14px;position:relative;z-index:1}
.viva-main-copy h1{font-size:clamp(25px,7vw,36px);margin:13px 0 8px}
.viva-main-copy p{font-size:12px;line-height:1.5;max-width:290px}
.viva-main-art{flex:0 0 40%;max-width:174px;min-width:107px;align-self:flex-end;margin-bottom:-1px;position:relative;z-index:1}
.viva-main-art .viva-mascot{width:100%;height:auto}
.coach-avatar.viva-svg-avatar{display:block;position:relative;flex-shrink:0;background:none;box-shadow:none;transform:none;width:90px;height:108px;border-radius:0;font-size:initial}
.coach-avatar.viva-svg-avatar .viva-mascot{width:100%;height:100%}
.coach-feature .coach-avatar.viva-svg-avatar{width:56px;height:65px}
.coach-hero .coach-avatar.viva-svg-avatar{width:98px;height:115px}
.viva-mini-figure{width:72px;height:71px;flex-shrink:0;position:relative;border-radius:13px;overflow:hidden}
.viva-exercise-art{display:block;width:100%;height:100%;border-radius:13px}
.viva-exercise-art.small{max-height:112px}
.viva-exercise-art.large{width:100%;height:100%;max-width:145px;max-height:145px;margin:auto;border-radius:24px}
.viva-figure-number{position:absolute;left:4px;top:3px;width:20px;height:20px;display:grid;place-items:center;border-radius:8px;background:#fffefddd;color:#dc6228;font-size:10px;font-weight:900}
.coach-move{align-items:center}.coach-move>div:last-child{flex:1;min-width:0}
.viva-stage-figure{width:76px;min-width:76px;height:78px;border-radius:12px;overflow:hidden}
.viva-ex-row{align-items:center}.viva-ex-row>div:last-child{min-width:0}
.viva-visual-note{font-size:11px!important;color:#988b89!important;margin:0 0 13px!important;line-height:1.5}
.viva-focus-picture{width:132px;height:132px;margin:0 auto 14px;display:grid;place-items:center}
.viva-focus-picture>.viva-exercise-art{max-width:132px;max-height:132px;border-radius:23px}
.viva-finish-mascot{width:110px;height:135px;margin:auto}
.viva-finish-mascot>.viva-mascot{width:100%;height:100%}
@media(max-width:410px){
 .viva-main-hero{padding:14px 8px 0 17px;gap:0;min-height:205px}
 .viva-main-art{flex-basis:38%;min-width:103px}
 .viva-main-copy h1{font-size:29px}

/* VIVA interface: neutral surfaces, compact hierarchy, accessible controls */
:root{--ink:#252729;--soft:#687079;--orange:#bd582d;--bg:#fff;--line:#e4e6e7}
html,body{background:#f1f2f2;color:var(--ink)}
.wrap{background:#fff;padding:18px 17px 112px}
.header{margin-bottom:21px}
.sig{border:0;background:#f5f6f6;color:#61676b;padding:8px 11px;font-size:11px;font-weight:650}
.kicker{letter-spacing:1.1px;font-size:10px;color:#9b5639}
.card,.soft-card,.coach-daycard,.stage-block,.viva-aerobic-panel{border-color:#e5e7e7;background:#fff;border-radius:16px;box-shadow:none}
.primary{background:#bd582d;border-radius:12px;box-shadow:none;font-weight:750;padding:15px 17px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.sub{border-color:#dfe3e3;border-radius:11px}
.section h2{letter-spacing:-.35px;font-size:18px}
.nav{background:#ffffffed;border-top:1px solid #e1e4e4;padding:9px 4px calc(10px + env(safe-area-inset-bottom))}
.nav button{color:#747b80;min-width:0;flex:1;font-size:10px;gap:5px;padding:6px 1px}
.nav button.active{color:#a7502a;font-weight:800}
.nav button .viva-nav-icon{height:23px;display:grid;place-items:center}
.nav button .viva-nav-icon svg{width:20px;height:20px}
.viva-home-top{border:1px solid #e5e8e8;background:#f8f9f9;padding:20px 18px 16px;border-radius:18px;margin:6px 0 13px}

.viva-home-action>div{min-width:0;flex:1}
.viva-home-action b{font-size:14px;display:block}
.viva-home-action small{display:block;margin-top:5px;color:#687178;line-height:1.45;font-size:11px}
.viva-home-action button{background:#bd582d;color:white;border:0;border-radius:11px;padding:12px 14px;font-size:12px;font-weight:800;white-space:nowrap}
.viva-home-note{font-size:12px;line-height:1.5;color:#657078;margin:-2px 0 12px}
.durations{gap:8px}
.dur,.dur:nth-child(2),.dur:nth-child(3){background:#f6f7f7;border:1px solid #e4e6e6;border-radius:13px;min-height:86px;text-align:center;padding:12px 8px}
.dur.active{border:2px solid #bd582d;box-shadow:none;background:#fff9f6}
.dur b{font-size:22px;margin:3px 0 8px;font-weight:850}
.dur small{font-size:10px;color:#6b7378}
.coach-hero,.library-intro{background:#f7f8f8;border-color:#e5e6e6;border-radius:16px;padding:16px}
.coach-hero h2,.library-intro h2{font-size:21px;letter-spacing:-.45px}
.coach-hero p,.library-intro p{color:#636e73}
.coach-hero .coach-avatar.viva-svg-avatar{width:53px;height:63px}
.coach-library-strip,.coach-prescription,.viva-workout-protocol{background:#f9faf9;border:1px solid #e2e7e3;border-radius:13px}
.coach-library-strip button{background:#fff;color:#a5502b;border:1px solid #e5d8d1;border-radius:10px}
.coach-metrics>div{border:1px solid #e6e9e9;background:#fff;border-radius:12px}
.coach-day{border-radius:11px;background:#f7f8f8;border:1px solid #e4e7e7}
.coach-day.active{background:#fdf7f3;border:2px solid #bd582d;color:#a84c27}
.coach-day small{color:#767d81}
.coach-tags span{background:#f1f3f2;color:#56615c}
.coach-move{border-top:1px solid #e8ebea}
.coach-move b{font-size:13px}
.coach-move small{color:#667078}
.viva-workout-protocol p,.viva-protocol-phases span{color:#5c696d}
.viva-protocol-phases span{border-color:#e4e8e6;background:#fff}
.viva-protocol-phases b{color:#af532d}
.viva-dose{background:#eef4f0;color:#477460}
.library-entry{border:1px solid #e5e7e7;border-radius:13px;background:#fff;min-height:112px}
.library-number,.library-action{color:#ac542e!important}
.library-preview{border-radius:15px;border-color:#e5e8e8}
.viva-readiness-state,.viva-strength-volume,.viva-insight{border-radius:13px}
.viva-aerobic-score b,.viva-aerobic-score strong{font-size:19px}
.guide-link{color:#a94d29}
.footer{color:#6d7477;line-height:1.55;font-size:11px}

function end(){
 if(!session)return;

 const enough=(session.skippedSeconds||0)<=session.total*.2;
 beep(enough?900:550,2);say(enough?'Treino concluído. Sessão registrada.':'Sessão encerrada. Ela não será registrada como treino concluído.');
 finishedPartial=!enough;

 if(session.coach){
  h.coach=true;h.coachDay=session.coach.day;h.coachWeek=session.coach.week;h.coachFocus=session.coach.focus;h.coachId=session.coachId;h.coachRecovery=session.coach.kind==='Recuperação ativa';
  h.coachAnchors=[...(session.coach.anchors||[])].filter(id=>VivaCoach.getExercise(id)).slice(0,2);h.coachType=session.coach.mode||null;h.coachMainMinutes=session.coach.mode==='cardio'?Number(session.coach.mainMinutes)||0:0;h.coachSets=Number(session.coach.sets)||null;finishedCoachId=h.coachId;

function start(isCoach=false){
 const m=isCoach?coachModel():null;

  alert(m.weekend?'Os treinos do professor estão programados de segunda a sexta.':m.readiness.canStart?'Reative exercícios em Ajustes antes de começar.':m.readiness.description);
  return;
 }
 enableSound();keepAwake();
 const minutes=isCoach?m.duration:data.duration,steps=isCoach?VivaTraining.build(m):timeline(minutes,null,data.low);
 const id=isCoach?'viva-'+Date.now()+'-'+Math.floor(Math.random()*100000):null;
 const anchors=m&&m.kind==='Força'?m.moves.slice(0,2).map(x=>x.id).filter(Boolean):[];
 session={steps,duration:minutes,total:minutes*60,at:0,mark:Date.now(),paused:false,index:0,lastPhase:null,lastBeepSecond:null,skippedSeconds:0,
 coach:isCoach?{day:m.day,week:m.week,focus:m.title,kind:m.kind,anchors,mode:m.training.type,mainMinutes:m.training.main,sets:m.training.sets}:null,coachId:id};

function keepAwake(){try{if(navigator.wakeLock&&navigator.wakeLock.request&&!lock)navigator.wakeLock.request('screen').then(x=>lock=x).catch(()=>{})}catch{}}function releaseAwake(){if(lock){try{lock.release()}catch{}lock=null}}
function enableSound(){try{let C=window.AudioContext||window.webkitAudioContext;if(!ctx&&C)ctx=new C();if(ctx&&ctx.state==='suspended')ctx.resume();audioReady=!!ctx;}catch(err){audioReady=false}return audioReady}
function beep(freq=630,count=1){if(!data.sound||!ctx)return;try{const t=ctx.currentTime+.004;for(let i=0;i<count;i++){let o=ctx.createOscillator(),g=ctx.createGain(),at=t+i*.11;o.type='sine';o.frequency.setValueAtTime(freq+i*90,at);g.gain.setValueAtTime(0.001,at);g.gain.exponentialRampToValueAtTime(Math.max(.003,data.volume*.13),at+.008);g.gain.exponentialRampToValueAtTime(.001,at+.075);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+.082)}}catch(err){}}
function say(txt){if(!data.voice||!('speechSynthesis'in window))return;try{let sy=window.speechSynthesis;sy.cancel();let ut=new SpeechSynthesisUtterance(txt);ut.lang='pt-BR';ut.rate=1.04;ut.pitch=1;ut.volume=.95;let vs=sy.getVoices(),voice=vs.find(x=>x.lang.toLowerCase()==='pt-br')||vs.find(x=>x.lang.toLowerCase().startsWith('pt'));if(voice)ut.voice=voice;sy.speak(ut)}catch(err){}}
function quiet(){try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch{}}
function announceStep(s,first=false){if(!session)return;let phase=first||session.lastPhase!==s.phase?s.phase+'. ':'';session.lastPhase=s.phase;let txt=s.rest?'Descanso. '+s.seconds+' segundos.':s.mode==='strength'?phase+s.name+'. Série '+s.setNumber+' de '+s.sets+'. Faça de '+s.reps+' repetições com controle. Você tem até '+s.seconds+' segundos. Pare quando completar, sem acelerar. '+(s.hint||''):phase+s.name+'. '+s.seconds+' segundos.'+(s.hint?' '+s.hint:'');beep(s.rest?520:800,2);say(txt)}
function audioSecond(s,left){if(!session||session.paused)return;const n=Math.ceil(left);if(n<1||n>40)return;if(n<=5){beep(n<=3?1100:970,2);if(data.countdown&&data.voice&&n<=3)say(String(n))}else{beep(620,1)}}
function tick(){if(!session)return;if(!session.paused&&Date.now()-lastCheckpoint>=15000)checkpoint();let e=elapsed();if(e>=session.total){end();return}let idx=indexAt(e),s=session.steps[idx];if(session.index!==idx){session.index=idx;session.lastBeepSecond=null;announceStep(s);render();return}if(!session.paused&&document.visibilityState!=='hidden'){let left=Math.ceil(s.end-e);if(left!==session.lastBeepSecond){session.lastBeepSecond=left;if(left<s.seconds)audioSecond(s,left)}}let q=(e-s.start)/s.seconds;for(let [key,value] of [['#timer',time(s.end-e)],['#elapsed',`${time(e)} / ${session.duration}:00`],['#pc',Math.floor(pct())+'%']]){let el=$(key);if(el)el.textContent=value}let ring=$('#ring');if(ring)ring.style.setProperty('--pct',Math.floor(q*100)+'%');let fill=$('#fill');if(fill)fill.style.width=pct()+'%'}
